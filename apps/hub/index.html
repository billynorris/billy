<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billy Norris</title>
    <!-- Pre-paint theme: .gay serves the same site in a pride skin. -->
    <script>
      (function () {
        try {
          if (location.hostname.endsWith(".gay"))
            document.documentElement.dataset.theme = "pride";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
